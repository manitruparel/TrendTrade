<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Max UI | Glassmorphism</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: #050203;
            /* A rich, modern gradient mesh background */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 0, 60, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.15), transparent 25%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
        }

        /* The floating background orb to prove the glass is translucent */
        .orb {
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #ff003c, #ffcc00);
            border-radius: 50%;
            filter: blur(40px);
            animation: floatOrb 8s infinite alternate ease-in-out;
            z-index: 1;
        }

        /* The Pro Max Glassmorphism Card */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 450px;
            padding: 40px;
            border-radius: 24px;
            /* The Magic Glass Effect */
            background: rgba(25, 25, 25, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            /* The sleek semi-transparent border */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 0, 60, 0.4);
        }

        .tag {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(255, 0, 60, 0.2);
            color: #ff003c;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 0, 60, 0.3);
        }

       h2 {
    font-size: 28px;
    margin-bottom: 10px;
    background: linear-gradient(to right, #ffffff, #aaaaaa);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

        p {
            color: #a0a0a0;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: #ff003c;
            border-color: #ff003c;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.4);
        }

        @keyframes floatOrb {
            0% { transform: translate(-100px, -50px) scale(0.8); }
            100% { transform: translate(100px, 50px) scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- This glowing orb floats behind the card to show off the glass blur -->
    <div class="orb"></div>

    <div class="glass-card">
        <div class="tag">System Overlord</div>
        <h2>Spider's Web Core</h2>
        <p>This UI is generated using purely native browser rendering capabilities. No heavy frameworks, no terminal installations, and zero latency.</p>
        <a href="#" class="btn">Access Database</a>
    </div>

</body>
</html>
