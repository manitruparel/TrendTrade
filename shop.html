<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendTrade | Retailer App</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #2563EB; 
            --primary-glow: rgba(37, 99, 235, 0.4);
            --accent: #10B981; 
            --bg: #F8FAFC; 
            --card-bg: #FFFFFF; 
            --text: #0F172A; 
            --text-muted: #64748B;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg); color: var(--text); padding-bottom: 90px; overflow-x: hidden; }

        /* Top App Bar */
        .app-header {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 20px 5%; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #E2E8F0;
        }
        .back-btn { color: var(--primary); text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 16px;}
        
        .container { padding: 30px 5%; max-width: 1200px; margin: 0 auto; }
        
        /* Interactive Search Engine */
        .search-container { position: sticky; top: 80px; z-index: 90; background: var(--bg); padding: 10px 0 20px; }
        .search-bar {
            background: var(--card-bg); padding: 16px 24px; border-radius: 100px; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 2px solid transparent; transition: 0.3s;
        }
        .search-bar:focus-within { border-color: var(--primary); box-shadow: 0 10px 30px var(--primary-glow); transform: translateY(-2px); }
        .search-bar input { border: none; outline: none; width: 100%; font-size: 16px; font-weight: 600; color: var(--text); background: transparent; }
        .search-bar input::placeholder { color: #94A3B8; font-weight: 500; }
        .search-bar i { color: var(--primary); font-size: 20px; }

        .header-section { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end; }
        .header-section h2 { font-size: 28px; font-weight: 800; }
        .result-count { color: var(--primary); font-weight: 700; background: rgba(37, 99, 235, 0.1); padding: 5px 12px; border-radius: 20px; font-size: 14px; }

        /* Dynamic Grid Layout for 100+ Profiles */
        .feed-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 25px; 
        }

        /* Upgraded Creator Cards & Hover Physics */
        .creator-card {
            background: var(--card-bg); border-radius: 24px; padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #E2E8F0; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
            /* Animation triggers */
            opacity: 0; transform: translateY(30px); animation: fadeSlideUp 0.6s ease forwards;
        }

        @keyframes fadeSlideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .creator-card:hover { 
            transform: translateY(-8px) scale(1.02); 
            border-color: var(--primary); 
            box-shadow: 0 20px 40px rgba(37, 99, 235, 0.12); 
        }
        
        .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .avatar {
            width: 70px; height: 70px; border-radius: 20px; background-size: cover; background-position: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); position: relative; flex-shrink: 0;
        }
        .verified-tick { position: absolute; bottom: -5px; right: -5px; background: var(--card-bg); border-radius: 50%; padding: 2px; }
        .verified-tick i { color: var(--accent); font-size: 18px; }

        .profile-info h3 { font-size: 20px; font-weight: 800; margin-bottom: 4px; color: var(--text); }
        .niche-tag { 
            display: inline-block; background: var(--bg); color: var(--text-muted); 
            padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; 
        }

        .data-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 25px; background: var(--bg); padding: 15px; border-radius: 16px; border: 1px solid #F1F5F9; }
        .data-item { text-align: center; }
        .data-val { font-size: 18px; font-weight: 800; color: var(--text); }
        .data-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-top: 4px; }
        .highlight-val { color: var(--primary); }

        .hire-btn {
            background: var(--primary); color: white; padding: 14px; border-radius: 14px;
            font-weight: 800; text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px;
            text-decoration: none; transition: 0.3s; border: none; cursor: pointer; width: 100%;
        }
        .hire-btn:hover { background: #1D4ED8; box-shadow: 0 10px 20px var(--primary-glow); transform: translateY(-2px); }

        /* Mobile Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid #E2E8F0; display: flex; justify-content: space-around; padding: 15px 0 25px; z-index: 1000;
        }
        .nav-item { color: #94A3B8; text-align: center; font-size: 24px; transition: 0.3s; cursor: pointer; position: relative; }
        .nav-item.active { color: var(--primary); transform: translateY(-4px); }
        .nav-item span { display: block; font-size: 10px; margin-top: 6px; font-weight: 700; }
        .nav-indicator { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; border-radius: 50%; background: var(--primary); opacity: 0; transition: 0.3s; }
        .nav-item.active .nav-indicator { opacity: 1; bottom: -10px; }

        /* No Results State */
        .no-results { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .no-results i { font-size: 60px; color: #CBD5E1; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="app-header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Home</a>
        <div style="font-weight: 800; font-size: 18px;">Matchmaking Feed</div>
        <div style="width: 24px;"></div>
    </div>

    <div class="container">
        <!-- Live Search Engine -->
        <div class="search-container">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search niches (e.g. Fitness, Tech, Food, Gaming...)" onkeyup="filterCreators()">
            </div>
        </div>

        <div class="header-section">
            <h2>Local Creators</h2>
            <div class="result-count" id="resultCount">Loading...</div>
        </div>
        
        <!-- The Grid where JS will inject 120 profiles -->
        <div class="feed-grid" id="creatorFeed">
            <!-- Cards generate here -->
        </div>
    </div>

    <!-- Mobile Nav -->
    <div class="bottom-nav">
        <div class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span><div class="nav-indicator"></div></div>
        <div class="nav-item active"><i class="fa-solid fa-users-viewfinder"></i><span>Discover</span><div class="nav-indicator"></div></div>
        <div class="nav-item"><i class="fa-solid fa-calendar-days"></i><span>Bookings</span><div class="nav-indicator"></div></div>
        <div class="nav-item"><i class="fa-solid fa-wallet"></i><span>SafePay</span><div class="nav-indicator"></div></div>
    </div>

    <script>
        // --- PROCEDURAL GENERATION ENGINE ---
        
        // Data banks for randomized generation
        const firstNames = ["Aarav", "Priya", "Rahul", "Aisha", "Karan", "Neha", "Rohan", "Sneha", "Vikram", "Aditi", "Arjun", "Kiara", "Dev", "Meera", "Kabir", "Zara", "Jay", "Ananya"];
        const lastNames = ["Sharma", "Patel", "Singh", "Gupta", "Deshmukh", "Joshi", "Kapoor", "Verma", "Reddy", "Mehta", "Bose", "Chopra"];
        const niches = ["Food & Lifestyle", "Fitness & Gym", "Tech Reviewer", "Beauty & Makeup", "Travel Vlogger", "Gaming Creator", "Men's Fashion", "Finance & Crypto"];
        
        const feedContainer = document.getElementById('creatorFeed');
        const totalProfiles = 120; // Generates exactly 120 profiles instantly

        function generateProfiles() {
            let htmlContent = '';

            for(let i = 0; i < totalProfiles; i++) {
                // Randomize data
                let fName = firstNames[Math.floor(Math.random() * firstNames.length)];
                let lName = lastNames[Math.floor(Math.random() * lastNames.length)];
                let niche = niches[Math.floor(Math.random() * niches.length)];
                
                // Random stats math
                let views = (Math.random() * 40 + 5).toFixed(1); // 5k to 45k
                let reach = Math.floor(Math.random() * 20 + 80); // 80% to 99%
                let engagement = (Math.random() * 8 + 4).toFixed(1); // 4% to 12%
                
                // Fetch random unique avatar using pravatar API
                let avatarUrl = `https://i.pravatar.cc/150?u=${fName}${i}`;
                
                // Calculate dynamic pricing based on views
                let price = Math.floor(views * 150).toLocaleString();

                // Build the HTML Card with a staggered animation delay based on index
                let delay = (i < 20) ? i * 0.05 : 0; // Stagger the first 20 so it waterfalls, snap the rest

                htmlContent += `
                <div class="creator-card" data-niche="${niche.toLowerCase()}" style="animation-delay: ${delay}s">
                    <div class="profile-header">
                        <div class="avatar" style="background-image: url('${avatarUrl}');">
                            <div class="verified-tick"><i class="fa-solid fa-circle-check"></i></div>
                        </div>
                        <div class="profile-info">
                            <h3>${fName} ${lName}</h3>
                            <div class="niche-tag">${niche}</div>
                        </div>
                    </div>
                    
                    <div class="data-grid">
                        <div class="data-item"><div class="data-val">${views}K</div><div class="data-label">Avg Views</div></div>
                        <div class="data-item"><div class="data-val highlight-val">${reach}%</div><div class="data-label">Local City</div></div>
                        <div class="data-item"><div class="data-val">${engagement}%</div><div class="data-label">Engagement</div></div>
                    </div>
                    
                    <button class="hire-btn" onclick="triggerHire('${fName}')">
                        <i class="fa-solid fa-lock"></i> Hire via SafePay (₹${price})
                    </button>
                </div>
                `;
            }
            
            feedContainer.innerHTML = htmlContent;
            updateResultCount(totalProfiles);
        }

        // Initialize generator
        generateProfiles();

        // --- REAL-TIME SEARCH FILTER ---
        function filterCreators() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.querySelectorAll('.creator-card');
            let visibleCount = 0;

            cards.forEach(card => {
                let niche = card.getAttribute('data-niche');
                let name = card.querySelector('h3').innerText.toLowerCase();
                
                // If input matches niche OR name
                if(niche.includes(input) || name.includes(input)) {
                    card.style.display = "flex";
                    visibleCount++;
                } else {
                    card.style.display = "none";
                }
            });

            // Show no results graphic if count is 0
            if(visibleCount === 0) {
                feedContainer.innerHTML = `
                    <div class="no-results">
                        <i class="fa-solid fa-ghost"></i>
                        <h3>No creators found</h3>
                        <p>Try searching a different niche like 'Gaming' or 'Fashion'</p>
                    </div>
                `;
            } else if (document.querySelector('.no-results')) {
                // Re-run generator to restore cards if they backspace
                generateProfiles(); 
                filterCreators(); // Re-apply current filter text
            }

            updateResultCount(visibleCount);
        }

        function updateResultCount(count) {
            document.getElementById('resultCount').innerText = `${count} Profiles Active`;
        }

        // Interactive Button Alert
        function triggerHire(name) {
            alert(`SafePay Escrow Initiated for ${name}.\n\nYour funds are secured and their calendar is now blocked for double-bookings.`);
        }
    </script>
</body>
</html>
